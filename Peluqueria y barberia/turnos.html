<body>
<section id="turnos" class="py-5">
    <div class="container">

        <h2 class="text-center mb-4">
            Reservá tu turno
        </h2>

        <form>
            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre y apellido
                </label>
                <input type="text" class="form-control"
                       id="nombre" name="nombre"
                       placeholder="Ingresá tu nombre" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">
                    Correo electrónico
                </label>
                <input type="email" class="form-control"
                       id="correo" name="correo"
                       placeholder="ejemplo@gmail.com" required>
            </div>

            <div class="mb-3">
                <label for="servicio" class="form-label">
                    Elegí un servicio
                </label>

                <select class="form-select" id="servicio"
                        name="servicio" required>
                    <option value="">Seleccionar servicio</option>
                    <option value="corte">Corte</option>
                    <option value="afeitado">Afeitado profesional</option>
                    <option value="ninos">Niños</option>
                    <option value="tratamientos">Tratamientos</option>
                    <option value="coloracion">Coloración y decoloración</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="fecha" class="form-label">
                    Fecha del turno
                </label>
                <input type="date" class="form-control"
                       id="fecha" name="fecha" required>
            </div>
            <div class="mb-3">
                <label for="horario" class="form-label">
                    Horario preferido
                </label>
                <select class="form-select" id="horario"
                        name="horario" required>
                    <option value="">Seleccionar horario</option>
                    <option value="09:00">09:00</option>
                    <option value="11:00">11:00</option>
                    <option value="15:00">15:00</option>
                    <option value="17:00">17:00</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn boton-turno">
                    Solicitar turno
                </button>
            </div>

        </form>
    </div>
</section>


    
</body>
